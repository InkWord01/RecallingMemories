<?xml version="1.0" encoding="UTF-8"?>
<!--
  拾忆 App 图标 — 1024×1024 矢量源
  视觉：暖色系渐变背景 + 主星 + 两颗副星，与首屏引导第一页配色呼应
  导出：在 macOS 上执行 `tools/generate-icons.sh` 生成 PNG
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD27A"/>
      <stop offset="45%" stop-color="#E8A0C8"/>
      <stop offset="100%" stop-color="#5B3A8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="490" rx="380" ry="380" fill="url(#glow)"/>

  <!-- 主星：四角星，类 sparkles 形态 -->
  <g transform="translate(512, 500)">
    <path
      d="M 0,-260
         C 28,-110 28,-110 140,-58
         C 252,-28 252,-28 140,28
         C 28,58 28,58 0,210
         C -28,58 -28,58 -140,28
         C -252,-28 -252,-28 -140,-58
         C -28,-110 -28,-110 0,-260 Z"
      fill="#FFFFFF"
      filter="url(#soft)"
      opacity="0.96"/>
  </g>

  <!-- 右上副星 -->
  <g transform="translate(770, 290) scale(0.42)" opacity="0.88">
    <path
      d="M 0,-130
         C 14,-50 14,-50 70,-28
         C 130,-14 130,-14 70,14
         C 14,28 14,28 0,110
         C -14,28 -14,28 -70,14
         C -130,-14 -130,-14 -70,-28
         C -14,-50 -14,-50 0,-130 Z"
      fill="#FFFFFF"/>
  </g>

  <!-- 左下副星 -->
  <g transform="translate(260, 700) scale(0.32)" opacity="0.75">
    <path
      d="M 0,-130
         C 14,-50 14,-50 70,-28
         C 130,-14 130,-14 70,14
         C 14,28 14,28 0,110
         C -14,28 -14,28 -70,14
         C -130,-14 -130,-14 -70,-28
         C -14,-50 -14,-50 0,-130 Z"
      fill="#FFFFFF"/>
  </g>

  <!-- 微光粒子 -->
  <circle cx="180" cy="220" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="860" cy="180" r="4" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="850" cy="780" r="5" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="160" cy="850" r="3" fill="#FFFFFF" opacity="0.45"/>
</svg>
