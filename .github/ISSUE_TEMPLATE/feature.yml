name: 功能建议
description: 提一个新功能想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 「想在记录时直接捕捉天气信息」
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: 你设想的解决方案
      placeholder: 描述你期望的交互或视觉

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 还想过什么其它方案？为什么不用？

  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 截图 / 引用 / 类似产品的实现
