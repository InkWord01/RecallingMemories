# GitHub Actions CI — 拾忆 RecallingMemories
#
# 每次 push / PR 自动跑：
#   1. lint：YAML / shell 语法快速检查（任意 runner）
#   2. build：在 macOS runner 上 xcodegen → build → test
#
# Mac runner 计费贵，仅在 PR / main push 时跑。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 只保留最新一次运行（同一 PR 多次推送时取消旧 job）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 轻量 lint：跑在 ubuntu，零成本 ───
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project.yml syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('project.yml'))"

      - name: Shellcheck tools/
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find tools -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Verify SVG well-formed
        run: |
          for svg in design/*.svg; do
            xmllint --noout "$svg"
          done

  # ─── 构建 + 测试：仅 Mac runner ───
  build-and-test:
    runs-on: macos-15   # 升级到 macos-15，预装 Xcode 16
    needs: lint
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # 优先 Xcode 16（XcodeGen 新版生成的 pbxproj 格式 v77 需要 Xcode 16+）
        # 回退 Xcode 15 仅作 last resort
        run: |
          AVAILABLE=""
          for dir in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if compgen -G "$dir" > /dev/null; then
              AVAILABLE=$(ls -d $dir 2>/dev/null | sort -V | tail -1)
              [ -n "$AVAILABLE" ] && break
            fi
          done
          if [ -z "$AVAILABLE" ]; then
            echo "::error::未找到任何 Xcode"
            exit 1
          fi
          echo "Selected: $AVAILABLE"
          sudo xcode-select -s "$AVAILABLE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcodegen librsvg
          # xcpretty 多数 runner 已预装；缺失时降级为纯 xcodebuild 输出
          gem install xcpretty || true

      - name: Generate Asset Catalog binaries
        run: bash tools/generate-icons.sh

      - name: Generate Xcode project
        run: xcodegen generate

      # 选一个真实存在的 iPhone 模拟器名（runner 上的 Xcode 不同版本预装机型不同）
      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          # 优先 iPhone 16 Pro / 15 / 16；按优先级回退
          targets = ["iPhone 16 Pro", "iPhone 15 Pro", "iPhone 16", "iPhone 15", "iPhone 14"]
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d.get("isAvailable") and d["name"] in targets:
                      print(d["name"]); sys.exit(0)
          # 兜底：取第一个可用 iPhone
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime: continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["name"]); sys.exit(0)
          ')
          echo "Picked simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 构建主 App（不签名，CI 没有 provisioning profile）
      - name: Build app
        run: |
          xcodebuild build \
            -project RecallingMemories.xcodeproj \
            -scheme RecallingMemories \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color
          exit ${PIPESTATUS[0]}

      # 跑单元测试
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project RecallingMemories.xcodeproj \
            -scheme RecallingMemories \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit
          exit ${PIPESTATUS[0]}

      # 失败时上传 xcresult 便于排查
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 7

      # JUnit 报告（xcpretty 生成在 build/reports/junit.xml）
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: build/reports/junit.xml
          retention-days: 14
          if-no-files-found: ignore
